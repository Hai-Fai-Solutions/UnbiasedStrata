[env]
MODEL_DIR = "{{config_root}}/models"

[tasks."mtp:download"]
description = "Download the Qwen3.6 GGUF base and MTP GGUF models"
run = """
set -e
mkdir -p "$MODEL_DIR" "$MODEL_DIR/.base" "$MODEL_DIR/.mtp"
hf download unsloth/Qwen3.6-35B-A3B-GGUF Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf --local-dir "$MODEL_DIR/.base"
hf download unsloth/Qwen3.6-35B-A3B-MTP-GGUF Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf --local-dir "$MODEL_DIR/.mtp"
mv -f "$MODEL_DIR/.base/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf" "$MODEL_DIR/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf"
mv -f "$MODEL_DIR/.mtp/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf" "$MODEL_DIR/Qwen3.6-35B-A3B-UD-Q4_K_XL-MTP.gguf"
rmdir "$MODEL_DIR/.base" "$MODEL_DIR/.mtp" 2>/dev/null || true
"""

[tasks."packs:generate-trunk"]
description = "Generate trunk pack from the base GGUF"
run = "python3 -I tools/iq_pack.py --gguf \"$MODEL_DIR/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf\" --out \"$MODEL_DIR/qwen36-q4\""

[tasks."packs:generate-mtp"]
description = "Generate draft pack from the MTP GGUF"
run = "python3 -I tools/mtp_qwen36_pack.py --gguf \"$MODEL_DIR/Qwen3.6-35B-A3B-UD-Q4_K_XL-MTP.gguf\" --out \"$MODEL_DIR/qwen36-mtp-draft\" --draft-vocab data/draft_vocab.bin"

[tasks."packs:generate"]
description = "Generate both trunk and draft packs"
depends = ["packs:generate-trunk", "packs:generate-mtp"]

[tasks."build"]
description = "Configure and build unbiased-strata (uses Makefile for CUDA flags and patching)"
run = "make build"

[tasks."serve:start"]
description = "Start Strata API server (foreground; use serve:start-bg for background)"
run = "./build/unbiased-strata --model \"$MODEL_DIR/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf\" --pack \"$MODEL_DIR/qwen36-q4\" --mtp \"$MODEL_DIR/qwen36-mtp-draft\" --ctx 262144 --host 0.0.0.0 --port 8080 -- --kv q4_0 --spec 2 --mtp-max-t 2"

[tasks."serve:start-bg"]
description = "Start Strata API server in background, logging to strata.log"
run = "nohup ./build/unbiased-strata --model \"$MODEL_DIR/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf\" --pack \"$MODEL_DIR/qwen36-q4\" --mtp \"$MODEL_DIR/qwen36-mtp-draft\" --ctx 262144 --host 0.0.0.0 --port 8080 -- --kv q4_0 --spec 2 --mtp-max-t 2 > strata.log 2>&1 & echo $! > strata.pid"

[tasks."mtp:serve:start"]
description = "Alias for serve:start"
depends = ["serve:start"]

[tasks."mtp:serve:start-bg"]
description = "Alias for serve:start-bg"
depends = ["serve:start-bg"]

[tasks."obs:secrets"]
description = "Create docker/.env with random secrets if missing (never overwrites)"
run = """
set -e
if [ ! -f docker/.env ]; then
  mkdir -p docker
  cp docker/.env.example docker/.env
  python3 - <<'PY'
from pathlib import Path
import secrets
p=Path('docker/.env')
s=p.read_text()
lines=[]
for line in s.splitlines():
    if line.startswith('NEXTAUTH_SECRET='):
        lines.append('NEXTAUTH_SECRET='+secrets.token_hex(32))
    elif line.startswith('SALT='):
        lines.append('SALT='+secrets.token_hex(32))
    elif line.startswith('LITELLM_MASTER_KEY='):
        lines.append('LITELLM_MASTER_KEY=sk-local-'+secrets.token_hex(16))
    else:
        lines.append(line)
# preserve any extra user lines (e.g. Langfuse keys)
with open('docker/.env','a') as f:
    pass
Path('docker/.env').write_text('\\n'.join(lines)+'\\n')
PY
  echo "Created docker/.env with random secrets. Add Langfuse keys, then run obs:up."
fi
"""

[tasks."obs:up"]
description = "Start Langfuse + LiteLLM observability stack"
depends = ["obs:secrets"]
dir = "docker"
run = "docker compose up -d"

[tasks."obs:down"]
description = "Stop observability stack"
dir = "docker"
run = "docker compose down"

[tasks."obs:logs"]
description = "Tail observability stack logs"
dir = "docker"
run = "docker compose logs -f"

[tasks."obs:restart-litellm"]
description = "Restart LiteLLM after updating .env keys"
dir = "docker"
run = "docker compose restart litellm"